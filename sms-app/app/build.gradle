plugins {
    id 'com.android.application'
}

def runNo = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'com.tradclub.cardsms'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tradclub.cardsms'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }

    signingConfigs {
        fixed {
            storeFile file('../keystore.jks')
            storePassword 'tradclub'
            keyAlias 'cardsms'
            keyPassword 'tradclub'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
